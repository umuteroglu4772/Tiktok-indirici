name: APK derle

on:
  push:
    paths-ignore:
      - "uygulama.py"
      - "sayfa.html"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        api: [34, 33]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gerekli paketleri kur
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache
          python -m pip install --upgrade pip
          python -m pip install buildozer "cython==0.29.36" virtualenv setuptools

      - name: Hedef surumu ayarla
        run: sed -i "s/^android.api = .*/android.api = ${{ matrix.api }}/" buildozer.spec

      - name: python-for-android'i hazirla ve yamala
        run: python yama.py

      - name: APK derle
        run: buildozer -v android debug

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Indirici-APK-hedef${{ matrix.api }}
          path: bin/*.apk
